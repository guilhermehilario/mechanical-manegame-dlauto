name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (G3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate de produção — falha apenas em high/critical. O resíduo moderado
      # (CVE-2026-35515 @nestjs/core) é aceito e documentado em
      # docs/security/remediation-plan.md (R1) / ADR-006+.
      - name: pnpm audit (prod)
        run: pnpm audit --prod --audit-level=high

  quality:
    name: lint + typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (G1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium do Playwright
        run: pnpm --dir apps/e2e exec playwright install --with-deps chromium
      # E2E sobe a própria API + web em portas isoladas (B4/B2) — admin via
      # senha aleatória por execução (R4). Não conflita com nada local.
      - name: Suíte E2E (portas isoladas)
        run: E2E_API_PORT=3101 E2E_WEB_PORT=5174 pnpm --dir apps/e2e test:e2e

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Banco limpo para o smoke
        run: |
          rm -f database/prisma/ci-smoke.db database/prisma/ci-smoke.db-journal database/prisma/ci-smoke.db-wal database/prisma/ci-smoke.db-shm
          DATABASE_URL=file:./ci-smoke.db pnpm --dir database db:deploy
      - name: Seed do admin
        run: >-
          DATABASE_URL=file:./ci-smoke.db
          SEED_ADMIN_EMAIL=smoke@oficina.local
          SEED_ADMIN_PASSWORD=ci-smoke-password-2026
          pnpm --dir database db:seed
      - name: Rodar smoke
        run: >-
          DATABASE_URL=file:./ci-smoke.db
          SEED_ADMIN_EMAIL=smoke@oficina.local
          SEED_ADMIN_PASSWORD=ci-smoke-password-2026
          pnpm --dir apps/api smoke